name: Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create .env from secrets
        run: |
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env
          echo "OPENROUTER_MODEL=${{ vars.OPENROUTER_MODEL || 'openrouter/fusion' }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Write cookies.txt for YouTube
        run: |
          echo "${{ secrets.YT_COOKIES }}" > cookies.txt
          echo "Created cookies.txt"

      - name: Restore auth files
        run: |
          # Write CLIENT_SECRETS_JSON directly without any decoding
          if [ -n "${{ secrets.CLIENT_SECRETS_JSON }}" ]; then
            cat > client_secrets.json << 'EOF'
          ${{ secrets.CLIENT_SECRETS_JSON }}
          EOF
            echo "✓ Created client_secrets.json"
          else
            echo '{}' > client_secrets.json
            echo "⚠ CLIENT_SECRETS_JSON is empty, created placeholder"
          fi
          
          # Write TOKEN_JSON directly without any decoding
          if [ -n "${{ secrets.TOKEN_JSON }}" ]; then
            cat > token.json << 'EOF'
          ${{ secrets.TOKEN_JSON }}
          EOF
            echo "✓ Created token.json"
          else
            echo '{}' > token.json
            echo "⚠ TOKEN_JSON is empty, created placeholder"
          fi

      - name: Run pipeline
        run: python pipeline.py --force

      - name: Upload shorts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: shorts/
          retention-days: 7
